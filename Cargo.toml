[package]
name = "lustro_rust"
version = "1.0.0"
edition = "2021"

[features]
default = ["thread-pinning"]
thread-pinning = []

[lib]
name = "lustro_rust"
crate-type = ["cdylib"]

[dependencies]
rayon = "1.10"
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"

[dev-dependencies]
rand = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
debug = false
incremental = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
